spring.application.name=medicompare-backend

server.port=${PORT:8080}
server.forward-headers-strategy=native

# =========================================================
# PostgreSQL Database
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/medicompare
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# File Upload
# =========================================================

file.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# =========================================================
# Spring AI + OpenRouter
# =========================================================

spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

spring.ai.openai.chat.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.api-key=${OPENROUTER_API_KEY}

spring.ai.openai.chat.model=openai/gpt-5-mini
spring.ai.openai.chat.max-completion-tokens=2000

spring.ai.openai.timeout=60s
spring.ai.openai.max-retries=3


# =========================================================
# Default Admin Seed Account
# =========================================================

admin.default.email=${ADMIN_DEFAULT_EMAIL:admin@medicompare.com}
admin.default.password=${ADMIN_DEFAULT_PASSWORD}

# =========================================================
# Swagger / OpenAPI
# =========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}

# =========================================================
# Email (Password Reset)
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.reset-url=${FRONTEND_URL:http://localhost:5173}/reset-password